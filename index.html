<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>quicktodo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <input
        id="input"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="今やること・考えていること"
      />
      <ul id="list" aria-label="todos"></ul>
      <footer id="footer">
        <span id="hint"></span>
        <button id="clear-done" type="button" tabindex="-1" hidden>済みを削除</button>
        <button id="help-button" type="button" tabindex="-1" aria-label="ヘルプ" title="ショートカット一覧">?</button>
      </footer>
      <section id="help" role="dialog" aria-label="ショートカット一覧" hidden>
        <div id="help-panel">
          <h2>ショートカット</h2>
          <div id="help-body"></div>
          <p id="help-close-hint">Esc またはクリックで閉じる</p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
